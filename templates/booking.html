    <script>
      (function() {
        var slotListEl = document.getElementById('appointment-slot-list');
        var dateInputEl = document.getElementById('reservation-date');
        var timeInputEl = document.getElementById('reservation-time');
        var slotsUrl = "{% url 'booking-slots' pk=doctor.doctor_id %}";

        var urlParams = new URLSearchParams(window.location.search || '');
        var prefillDate = urlParams.get('date') || '';
        var prefillTime = urlParams.get('time') || '';

        function pad2(n) {
          return String(n).padStart(2, '0');
        }

        function format12h(hours24, minutes) {
          var ampm = hours24 >= 12 ? 'PM' : 'AM';
          var h = hours24 % 12;
          if (h === 0) h = 12;
          return h + ':' + pad2(minutes) + ' ' + ampm;
        }

        function slotStartMinutesFromLabel(label) {
          // label format: "H:MM AM"
          var m = String(label).trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
          if (!m) return null;
          var h = parseInt(m[1], 10);
          var min = parseInt(m[2], 10);
          var ap = m[3].toUpperCase();
          if (ap === 'PM' && h !== 12) h += 12;
          if (ap === 'AM' && h === 12) h = 0;
          return (h * 60) + min;
        }

        function formatRangeLabel(startLabel) {
          var startMin = slotStartMinutesFromLabel(startLabel);
          if (startMin === null) return startLabel;
          var endMin = startMin + 30;
          var endH = Math.floor(endMin / 60);
          var endM = endMin % 60;
          return startLabel + ' - ' + format12h(endH, endM);
        }

        function buildSlots() {
          var out = [];
          // 10:00 AM inclusive to 4:00 PM end-exclusive, 30-min increments.
          for (var hour = 10; hour < 16; hour++) {
            out.push(format12h(hour, 0));
            out.push(format12h(hour, 30));
          }
          // Remove 4:30 PM (never added) and ensure last is 3:30 PM.
          return out;
        }

        function clearSelection() {
          timeInputEl.value = '';
          var active = slotListEl.querySelector('.active');
          if (active) active.classList.remove('active');
        }

        function renderSlots(booked) {
          var allSlots = buildSlots();
          slotListEl.innerHTML = '';
          clearSelection();

          if (!dateInputEl.value) {
            var empty = document.createElement('div');
            empty.className = 'list-group-item';
            empty.textContent = 'Select a date to see available time slots.';
            slotListEl.appendChild(empty);
            return;
          }

          var selectedDate = dateInputEl.value;
          var isToday = false;
          var cutoffMinutes = null;
          if (window.__serverToday && selectedDate && selectedDate === window.__serverToday) {
            isToday = true;
            cutoffMinutes = window.__serverNowMinutes;
          } else {
            // Fallback to browser clock if server values aren't available.
            var now = new Date();
            var todayStr = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate());
            if (selectedDate && selectedDate === todayStr) {
              isToday = true;
              cutoffMinutes = (now.getHours() * 60) + now.getMinutes();
            }
          }

          allSlots.forEach(function(startLabel) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'list-group-item list-group-item-action';
            btn.textContent = formatRangeLabel(startLabel);
            btn.setAttribute('data-slot', startLabel);

            var startMin = slotStartMinutesFromLabel(startLabel);
            if (isToday && startMin !== null && cutoffMinutes !== null && startMin <= cutoffMinutes) {
              btn.className += ' list-group-item-danger';
              btn.disabled = true;
              btn.setAttribute('aria-disabled', 'true');
              slotListEl.appendChild(btn);
              return;
            }

            if (booked && booked.indexOf(startLabel) !== -1) {
              btn.className += ' list-group-item-warning';
              btn.disabled = true;
              btn.setAttribute('aria-disabled', 'true');
            } else {
              btn.addEventListener('click', function() {
                var currentlyActive = slotListEl.querySelector('.active');
                if (currentlyActive) currentlyActive.classList.remove('active');
                btn.classList.add('active');
                timeInputEl.value = startLabel;
              });
            }

            slotListEl.appendChild(btn);
          });

          if (prefillTime) {
            var buttons = slotListEl.querySelectorAll('button[data-slot]');
            for (var i = 0; i < buttons.length; i++) {
              if (buttons[i].getAttribute('data-slot') === prefillTime && !buttons[i].disabled) {
                buttons[i].click();
                break;
              }
            }
          }
        }

        function loadBookedSlots() {
          if (!dateInputEl.value) {
            renderSlots([]);
            return;
          }

          var url = slotsUrl + '?date=' + encodeURIComponent(dateInputEl.value);
          fetch(url, { credentials: 'same-origin' })
            .then(function(resp) {
              if (!resp.ok) throw new Error('Failed to load slots');
              return resp.json();
            })
            .then(function(data) {
              window.__serverToday = (data && data.server_today) ? data.server_today : null;
              window.__serverNowMinutes = (data && typeof data.server_now_minutes === 'number') ? data.server_now_minutes : null;
              renderSlots((data && data.booked) ? data.booked : []);
            })
            .catch(function() {
              // If the endpoint fails, still show slots (no booked info).
              window.__serverToday = null;
              window.__serverNowMinutes = null;
              renderSlots([]);
            });

            // Prefill date on load (if provided) and trigger slot loading.
            if (prefillDate) {
              dateInputEl.value = prefillDate;
            }
        }

        dateInputEl.addEventListener('change', function() {
          loadBookedSlots();
        });
        dateInputEl.addEventListener('input', function() {
          loadBookedSlots();
        });

        // Initial render
        loadBookedSlots();
      })();
    </script>

          $(this).slick({
              infinite: true,
              dots: false,
              arrows: false,
              centerMode: true,
              centerPadding: '0'
          });

          $(this).closest('.slick-slider-area').find('.slick-prev').on("click", function() {
              slider.slick('slickPrev');
          });
          $(this).closest('.slick-slider-area').find('.slick-next').on("click", function() {
              slider.slick('slickNext');
          });
      });
    </script>

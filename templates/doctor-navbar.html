{% load static %}

<nav class="navbar navbar-expand-lg header-nav hs-navbar" aria-label="Primary">
  <div class="container">
    <a href="{% url 'hospital_home' %}" class="navbar-brand logo hs-brand" aria-label="HealthStack Home">
      <img
        src="{% static 'HealthStack-System/images/Normal/logo.jpg' %}"
        class="img-fluid hs-logo"
        alt="HealthStack"
      />
    </a>

    <button
      class="navbar-toggler hs-navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#hsDoctorNavbar"
      aria-controls="hsDoctorNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="hsDoctorNavbar">
      <ul class="navbar-nav mr-auto hs-nav">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'hospital_home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'doctor-dashboard' %}">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'multiple-hospital' %}">Hospitals</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'about-us' %}">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'chat-home' pk=user.id %}">Chat with Patients</a>
        </li>
      </ul>

      <div class="hs-nav-actions">
        <!-- User Dropdown -->
        <div class="nav-item dropdown hs-user-dropdown">
          <a href="#" class="dropdown-toggle hs-user-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <img
              class="rounded-circle hs-avatar"
              src="{{ doctor.featured_image.url }}"
              width="34" height="34"
              alt="{{ doctor.name|default:user.get_username|default:'Doctor' }}"
              onerror="this.onerror=null;this.src='{% static 'HealthStack-System/images/Normal/doctors/doctor-thumb-02.jpg' %}';"
            />
            <span class="hs-user-name d-none d-lg-inline-block">{{ doctor.name|default:user.get_username|default:'Doctor' }}</span>
          </a>
          <div class="dropdown-menu dropdown-menu-right hs-dropdown-menu">
            <div class="hs-dropdown-header">
              <img
                src="{{ doctor.featured_image.url }}"
                alt="{{ doctor.name|default:user.get_username|default:'Doctor' }}"
                class="rounded-circle hs-avatar"
                width="40" height="40"
                onerror="this.onerror=null;this.src='{% static 'HealthStack-System/images/Normal/doctors/doctor-thumb-02.jpg' %}';"
              />
              <div class="hs-dropdown-header-text">
                <strong>{{ doctor.name }}</strong>
                <small>Doctor</small>
              </div>
            </div>
            <a class="dropdown-item" href="{% url 'doctor-dashboard' %}"><i class="fas fa-columns mr-2"></i>Dashboard</a>
            <a class="dropdown-item" href="{% url 'doctor-profile-settings' %}"><i class="fas fa-user-cog mr-2"></i>Profile Settings</a>
            <a class="dropdown-item" href="{% url 'doctor-logout' %}"><i class="fas fa-sign-out-alt mr-2"></i>Logout</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

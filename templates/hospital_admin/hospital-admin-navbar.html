{% load static %}
<nav class="ha-topnav" role="navigation" aria-label="Admin top navigation">

    <!-- Left: sidebar toggle + brand -->
    <div class="ha-topnav-left">
        <button class="ha-toggler" id="haToggler" type="button" aria-label="Toggle sidebar" aria-controls="haSidebar" aria-expanded="false">
            <i class="fas fa-bars"></i>
        </button>

        <a class="ha-brand" href="{% url 'admin-dashboard' %}">
            <span class="ha-brand-icon"><i class="fas fa-heartbeat"></i></span>
            <span class="ha-brand-text">
                <span class="ha-brand-name">HealthStack</span>
                <span class="ha-brand-sub">Administration</span>
            </span>
        </a>
    </div>

    <!-- Right: hospital directory link + user dropdown -->
    <div class="ha-topnav-right">

        <a href="{% url 'hospital-list' %}" class="ha-nav-chip" aria-label="Hospital Directory">
            <i class="fas fa-hospital"></i>
            Hospital Directory
        </a>

        <div class="ha-user-dd" id="haUserDd">
            <button class="ha-user-btn" id="haUserBtn" type="button"
                    aria-haspopup="true" aria-expanded="false" aria-controls="haUserMenu">
                {% if admin and admin.featured_image %}
                    <img src="{{ admin.featured_image.url }}"
                         alt="{{ admin.name|default:'Administrator' }}"
                         class="ha-avatar"
                         onerror="this.style.display='none';document.getElementById('haAvatarInit').style.display='inline-flex'">
                    <span class="ha-avatar-init" id="haAvatarInit" style="display:none" aria-hidden="true">
                        {{ admin.name|default:'A'|first|upper }}
                    </span>
                {% else %}
                    <span class="ha-avatar-init" aria-hidden="true">
                        {{ admin.name|default:'A'|first|upper }}
                    </span>
                {% endif %}
                <span class="ha-user-info">
                    <span class="ha-user-name">{{ admin.name|default:'Administrator' }}</span>
                    <span class="ha-user-role">Hospital Admin</span>
                </span>
                <i class="fas fa-chevron-down ha-user-caret" aria-hidden="true"></i>
            </button>

            <div class="ha-dd-menu" id="haUserMenu" role="menu">
                <a class="ha-dd-item" href="{% url 'hospital-admin-profile' pk=user.id %}" role="menuitem">
                    <i class="fas fa-user-circle" aria-hidden="true"></i>
                    My Profile
                </a>
                <a class="ha-dd-item ha-dd-item--danger" href="{% url 'admin-logout' %}" role="menuitem">
                    <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                    Logout
                </a>
            </div>
        </div>

    </div>
</nav>

{% load static %}
<!-- Lab Navbar -->
<header class="lab-navbar" id="labNavbar">
    <div class="lab-navbar-left">
        <button class="lab-toggle-btn" onclick="toggleSidebar()" title="Toggle sidebar">
            <i class="fas fa-bars"></i>
        </button>
        <h4 class="lab-page-title">Lab Dashboard</h4>
    </div>

    <div class="lab-navbar-right">
        <div class="lab-user-dropdown dropdown">
            <button class="btn lab-user-btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                {% if lab_worker.featured_image %}
                <img src="{{ lab_worker.featured_image.url }}" alt="avatar" class="lab-nav-avatar">
                {% else %}
                <div class="lab-nav-avatar-placeholder"><i class="fas fa-user-md"></i></div>
                {% endif %}
                <span class="lab-nav-username">{{ lab_worker.name|default:user.username }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end lab-dropdown">
                <li class="lab-dropdown-header">
                    {% if lab_worker.featured_image %}
                    <img src="{{ lab_worker.featured_image.url }}" alt="" class="lab-dd-avatar">
                    {% endif %}
                    <div>
                        <strong>{{ lab_worker.name|default:user.username }}</strong>
                        <small class="d-block text-muted">Lab Technologist</small>
                    </div>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item" href="{% url 'lab-logout' %}">
                        <i class="fas fa-sign-out-alt me-2"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>
